name: Python test environment
description: >-
  Python 3.13 with the pinned packages (CPU-only torch), the embedding model from the cache, and a
  throwaway ChromaDB on localhost:8000, which ingestion/retrieval.py connects to as it loads.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install Python packages (CPU-only torch)
      shell: bash
      env:
        TORCH_VERSION: "2.14.1"  # the version tested locally; the CPU build skips gigabytes of CUDA libraries
      run: |
        python -m pip install "torch==$TORCH_VERSION" --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r requirements.txt

    - name: Read the embedding model name from the code
      id: model
      shell: bash
      run: |
        name=$(python -c 'import sys; sys.path.insert(0, "ingestion"); from embed_to_chroma import MODEL_NAME; print(MODEL_NAME)')
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Restore the embedding model
      id: hf-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/huggingface
        key: hf-${{ steps.model.outputs.name }}

    - name: Download the embedding model (first run only)
      if: steps.hf-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        MODEL_NAME: ${{ steps.model.outputs.name }}
      run: python -c 'import os; from sentence_transformers import SentenceTransformer; SentenceTransformer(os.environ["MODEL_NAME"])'

    # Saved straight away, so a failing test run still keeps the 1 GB download for next time.
    - name: Save the embedding model to the cache
      if: steps.hf-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/huggingface
        key: hf-${{ steps.model.outputs.name }}

    - name: Load the model offline from now on
      shell: bash
      run: echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"

    - name: Start a throwaway ChromaDB
      shell: bash
      run: |
        chroma run --path "$RUNNER_TEMP/chroma_data" --port 8000 > "$RUNNER_TEMP/chroma.log" 2>&1 &
        for _ in $(seq 30); do
          curl -sf http://localhost:8000/api/v2/heartbeat > /dev/null && exit 0
          sleep 1
        done
        echo "::error::ChromaDB did not start on port 8000"
        cat "$RUNNER_TEMP/chroma.log"
        exit 1
