[pytest]
# `python3 -m pytest` with no paths runs these folders.
testpaths = agent console config
# Only test_*.py files hold tests (agent/batch_test.py is a script).
python_files = test_*.py
# A misspelt marker is an error, not a test that quietly runs everywhere.
addopts = --strict-markers
markers =
    live: needs files or services that exist only on your own machine; deselected in CI with -m "not live"
    gemini: calls the real Gemini API with GEMINI_API_KEY; runs in its own CI job
